name: sync-docs

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "agents/skills/egern-docs/scripts/**"
      - ".github/workflows/sync-docs.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run converter tests
        working-directory: agents/skills/egern-docs
        run: python3 -m unittest discover scripts/tests -v

      - name: Scrape official documentation
        run: python3 agents/skills/egern-docs/scripts/scrape.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "documentation unchanged"
            exit 0
          fi
          git commit -m "chore: sync Egern documentation snapshot"
          git push
