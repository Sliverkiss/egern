name: 广告联盟去广告
description: 拦截穿山甲、优量汇、快手联盟三家广告联盟 SDK 请求，需清缓存或重装生效。
author: app2smile
homepage: https://github.com/app2smile/rules
icon: https://raw.githubusercontent.com/sooyaaabo/IconLibrary/main/Other/AdReject.png
# source: app2smile/rules module/adsense.conf
#   https://raw.githubusercontent.com/app2smile/rules/master/module/adsense.conf
#   三联盟改错误码脚本 → 本模块 jq 复刻:
#     穿山甲 has(message) → 伪造无填充响应（status_code 20001，官方"填充率控制"错误码）
#     优量汇 ret==0 → ret=102006（官方"无广告返回"错误码）
#     快手联盟 result==1 → result=40003（官方"无广告"错误码）
#   三种 body 形态键名互斥（message/ret/result），jq has() 分支可精确区分，
#   不依赖 URL 和请求方法 —— 已用三种真实 payload 验证全通过
#   js 里的 $notification 调试通知、console.log 日志：dropped（通知是调试用，打扰用户）
#   字节系 reject 端点、mitm 整域通配（snssdk/tiktokv 等会破坏抖音评论加载）：
#   dropped —— 严格对齐 app2smile 单一来源

body_rewrites:
  # 三联盟统一改错误码（原 app2smile adsense.js 的 jq 复刻）
  - response_jq:
      match: '^https?:\/\/(api-access\.pangolin-sdk-toutiao\.com\/api\/ad\/union\/sdk\/get_ads|open\.e\.kuaishou\.com\/rest\/e\/v3\/open\/univ|mi\.gdt\.qq\.com\/gdt_mview\.fcg)'
      filter: >-
        if has("message")
        then {"request_id":"F5617E54-3FF4-4052-9B09-4227D09B5105","status_code":20001,"reason":112}
        elif has("ret") and .ret == 0 then .ret = 102006
        elif has("result") and .result == 1 then .result = 40003
        else . end

mitm:
  hostnames:
    - api-access.pangolin-sdk-toutiao.com
    - open.e.kuaishou.com
    - mi.gdt.qq.com
