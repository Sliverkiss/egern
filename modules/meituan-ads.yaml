name: 美团去广告
description: 移除美团首页底栏视频/小团 tab、推荐流、个人页交叉推荐、搜索热词、AI 技能、购物车横幅与开屏图，需清缓存或重装生效。
author: TG@ZenMoFiShi
homepage: https://github.com/Sliverkiss/egern
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/c1/16/65/c1166517-71bb-d29d-d36e-516765f8a537/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-85-220.png/104x104bb.jpg
# merged from:
#   ZenmoFeiShi/Qx MT.snippet (2026-11-21，经 muktsoen/SurgeRules 的 Surge 镜像 MT.sgmodule
#     同步，QX 原版为 2026-10-25) — 全部内容：域名/IP 拦截层 + 8 端点结构改写
# absorption:
#   上游 MT.js 140 行按 URL 分 8 支，全部是固定结构编辑（删键、清数组、按 tabName/pageName
#   过滤），按阶梯第一级全部降为 response_jq，零脚本残留 —— 本模块不含任何 scriptings
#   · indexTab：确认 homepage/mine 两个保底 tab 在场后，丢 video/xiaotuan
#   · lycoris/scene：gwc_feed1_2265 与 personalcenter_2154 两场景清空推荐流并置
#     bottom=true + forbidByExp=true（上游靠请求 URL 场景名区分，这里由 match 各自钉住）
#   · usercenter/display：丢个人页 mine_cross_recommend
#   · defaultword / hotrecommend：清默认搜索词、热词、AI 搜索气泡
#   · getAppClientHornConfig：data 是字符串化 JSON，skills 置空后回写
#   · shoppingCartEntry / startupPicture：resourcesMap/resource（含 data 下的嵌套位）
#     的 topBannerArea / startupPicArea 清空
#   逐 filter 用带目标键与干扰键的合成 payload 验证过：只动该动的键，
#   键缺失时原样通过、不创建新键
#   上游两行 QX url reject（httpdns 域名组、103.37.155.60/fetch）保留为
#   url_rewrites：与域名/IP 规则构成双保险 —— 规则层没启用或环境不支持
#   rules 时，URL 层依然拦得住；规则层在连接期就掐断，两层谁先命中谁生效
#   MITM：5 个 jq 域名 + httpdns 四域名组（reject 匹配 https?，https 半边
#   需解密才拦得到；上游 QX 只写了两个，按 url_rewrites 实际触碰的四个补全）
#   Surge 侧 extended-matching 参数：Egern 规则无此概念（域名规则本就精确匹配）；
#   no-resolve 保留在 IP 规则上

rules:
  # —— 埋点/追踪域名：连接层拦截，不进 mitm ——
  - domain:
      match: shark-mt.meituan.com
      policy: REJECT
  - domain:
      match: shark-default.meituan.com
      policy: REJECT
  - domain:
      match: shark-dp.meituan.com
      policy: REJECT
  - domain:
