      policy: REJECT
  - domain:
      match: shark-wm.sankuai.com
      policy: REJECT
  - domain:
      match: shark.dianping.com
      policy: REJECT
  - domain_wildcard:
      match: mquic-*.meituan.com
      policy: REJECT
  # —— HTTPDNS：拦掉后客户端回落系统 DNS，广告域解析不到 ——
  - domain:
      match: httpdnsmultiapi.meituan.com
      policy: REJECT
  - domain:
      match: httpdnsmultiapivip.meituan.com
      policy: REJECT
  - domain:
      match: httpdns.meituan.com
      policy: REJECT
  - domain:
      match: httpdnsvip.meituan.com
      policy: REJECT
  - domain:
      match: dnspod.meituan.httpdns.qcloud.com
      policy: REJECT
  - domain:
      match: dnspod.meituan.httpdns.start.qcloud.com
      policy: REJECT
  # —— HTTPDNS 服务器 IP 直连兜底 ——
