name: 美团去广告
description: 移除美团首页底栏视频/小团 tab、推荐流、个人页交叉推荐、搜索热词、AI 技能、购物车横幅与开屏图，需清缓存或重装生效。
author: TG@ZenMoFiShi
homepage: https://github.com/Sliverkiss/egern
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/c1/16/65/c1166517-71bb-d29d-d36e-516765f8a537/AppIcon-0-0-1x_U007emarketing-0-0-0-7-0-0-sRGB-85-220.png/104x104bb.jpg
# merged from: ZenmoFeiShi/Qx MT.snippet (2026-11-21, via muktsoen/SurgeRules Surge 镜像)
# 上游 8 支脚本全部降为 response_jq；HTTPDNS 相关内容 dropped，交由分流层处理

rules:
  # —— 埋点/追踪域名：连接层拦截，不进 mitm ——
  - domain:
      match: shark-mt.meituan.com
      policy: REJECT
  - domain:
      match: shark-default.meituan.com
      policy: REJECT
  - domain:
      match: shark-dp.meituan.com
      policy: REJECT
  - domain:
      match: shark-ps.meituan.com
      policy: REJECT
  - domain:
      match: shark-wm.sankuai.com
      policy: REJECT
  - domain:
      match: shark.dianping.com
      policy: REJECT
  - domain_wildcard:
      match: mquic-*.meituan.com
      policy: REJECT

body_rewrites:
  # 首页底栏：确认 homepage/mine 在场后丢 video（视频）/xiaotuan（小团）tab
  - response_jq:
      match: '^https?://apimobile\.meituan\.com/aggroup/indexTab'
      filter: >-
        if ([.data?.resource?.tabArea[]? | (.tabName? // "")]
            | index("homepage") != null and index("mine") != null)
        then .data.resource.tabArea |= map(select((.tabName? // "") | test("^(video|xiaotuan)$") | not))
        else . end
  # 推荐流（购物车凑单 feed / 个人中心 feed）：清空并禁投
  - response_jq:
      match: '^https?://feedguess\.meituan\.com/lycoris/scene/(gwc_feed1_2265|personalcenter_2154)(\?|$)'
      filter: >-
        if ((.data? | type) == "array") then
          .data = []
          | .bottom = true
          | .ext = (if (.ext? | type) == "object" then .ext + {forbidByExp: true} else {forbidByExp: true} end)
        else . end
  # 个人页：丢“交叉推荐”区块
  - response_jq:
      match: '^https?://mt-personalcenter\.meituan\.com/usercenter/display'
      filter: >-
        if ((.children? | type) == "array")
        then .children |= map(select((.name? // "") | test("mine_cross_recommend") | not))
        else . end
  # 搜索默认词 + 热词
  - response_jq:
      match: '^https?://apimobile\.meituan\.com/group/v1/deal/searchpage/defaultword'
      filter: >-
        if ((.searchIntroduceResponse? | type) == "object") then
          .searchIntroduceResponse |= (
            (if ([.defaultWordRes?.defaultWordItems[]?] | length) > 0
             then .defaultWordRes.defaultWordItems = [] else . end)
            | (if ([.HotWordInfos[]?] | length) > 0
               then .HotWordInfos = [] else . end)
          )
        else . end
  # 搜索热词推荐位 + AI 搜索气泡
  - response_jq:
      match: '^https?://apimobile\.meituan\.com/group/v1/deal/searchpage/hotword/city/divide/hotrecommend/'
      filter: >-
        if ((.data? | type) == "object") then
          .data |= (
            (if ((.segmentsV2? | type) == "array")
             then .segmentsV2 |= map(
                    if ((.hotwordSegments? | type) == "array")
                       and any(.hotwordSegments[]?; ((.pageName? // "")
                             | test("^(EntranceHotwordsV2Hotwords|EntranceHotwordsV2ContentCard)$")))
                    then (.hotwordSegments |= map(select((.pageName? // "")
                             | test("^(EntranceHotwordsV2Hotwords|EntranceHotwordsV2ContentCard)$") | not)))
                         | (if ((.hotwordSegments | length) > 0) then . else empty end)
                    else . end)
             else . end)
            | (if ((.aiSearchBubble? | type) == "object")
                  and ([.aiSearchBubble.bubbleTexts[]?] | length) > 0
               then .aiSearchBubble.bubbleTexts = [] else . end)
          )
        else . end
  # AI 助手技能下发：data 为字符串化 JSON，skills 清空后回写
  - response_jq:
      match: '^https?://assistify\.meituan\.com/assistant/getAppClientHornConfig'
      filter: >-
        (.data | try fromjson catch null) as $d
        | if ($d != null)
             and (($d.skills? | type) == "object")
             and (($d.skills | length) > 0)
          then .data = ($d | .skills = {} | tojson)
          else . end
  # 购物车顶部横幅
  - response_jq:
      match: '^https?://mop\.meituan\.com/mop/entry/shoppingCartEntry'
      filter: >-
        (if ([.resourcesMap?.topBannerArea?[]?] | length) > 0 then .resourcesMap.topBannerArea = [] else . end)
        | (if ([.resource?.topBannerArea?[]?] | length) > 0 then .resource.topBannerArea = [] else . end)
        | (if ([.data?.resourcesMap?.topBannerArea?[]?] | length) > 0 then .data.resourcesMap.topBannerArea = [] else . end)
        | (if ([.data?.resource?.topBannerArea?[]?] | length) > 0 then .data.resource.topBannerArea = [] else . end)
  # 开屏图
  - response_jq:
      match: '^https?://mop\.meituan\.com/api/entryModule/startupPicture'
      filter: >-
        (if ([.resourcesMap?.startupPicArea?[]?] | length) > 0 then .resourcesMap.startupPicArea = [] else . end)
        | (if ([.resource?.startupPicArea?[]?] | length) > 0 then .resource.startupPicArea = [] else . end)
        | (if ([.data?.resourcesMap?.startupPicArea?[]?] | length) > 0 then .data.resourcesMap.startupPicArea = [] else . end)
        | (if ([.data?.resource?.startupPicArea?[]?] | length) > 0 then .data.resource.startupPicArea = [] else . end)

mitm:
  hostnames:
    - apimobile.meituan.com
    - feedguess.meituan.com
    - mop.meituan.com
    - mt-personalcenter.meituan.com
    - assistify.meituan.com
