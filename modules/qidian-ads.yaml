name: 起点读书去广告
description: 移除起点读书开屏、每日导读、各类弹窗、文末广告、搜索填充词，精简我的页面，需清缓存或重装生效。
author: 可莉🅥
homepage: https://github.com/Sliverkiss/egern
icon: https://raw.githubusercontent.com/luestr/IconResource/main/App_icon/120px/QiDian.png
# merged from: luestr/ProxyResource 起点读书去广告 (2025-05-13, 经 QingRex/LoonKissSurge Surge 镜像)
# 8 条 jq 合并为 3 个 filter（getconf 六键合一）；13 条 map-local 原样对应 map_locals
# 上游本就是 Loon http-response-jq 语法，同为声明式，零脚本

map_locals:
  # 开屏广告
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v4/client/getsplashscreen\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 广告下发
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/adv/'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # AB 实验
  - match: '^https://ywab\.reader\.qq\.com/user/experiments/v2\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 签到页
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/checkin/simpleinfo\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 弹窗
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/push/getdialog\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 推送消息列表
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/message/getpushedmessagelist$'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 运营位跑马灯
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/maintain/playstrip$'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 每日推荐书
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/dailyrecommend/recommendBook\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 新人书架按钮
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/freshman/bookshelfbtn$'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 书架顶部运营位
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/bookshelf/getTopOperation$'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 搜索填充词
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/booksearch/hotWords\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 章节末推广模块
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/followsubscribe/showChapterEndModule\?'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'
  # 青少年弹窗配置
  - match: '^https://magev6\.if\.qidian\.com/argus/api/v1/young/getconf$'
    status_code: 200
    headers: {Content-Type: application/json}
    body: '{}'

body_rewrites:
  # 全局配置：WolfEye 防重试/TeenShowFreq 青少年弹框置 0，活动弹窗/图标/
  # 福利袋/推送频率键删除（上游 6 条 getconf jq 合一）
  - response_jq:
      match: '^https://magev6\.if\.qidian\.com/argus/api/v1/client/getconf$'
      filter: >-
        if ((.Data? | type) == "object") then
          .Data |= (
            (if has("WolfEye") then .WolfEye = 0 else . end)
            | (if ((.CloudSetting? | type) == "object") and (.CloudSetting | has("TeenShowFreq"))
               then .CloudSetting.TeenShowFreq = 0 else . end)
            | del(.ActivityPageBackPushNoticeFrequency?, .ActivityIcon?, .ActivityPopup?, .LuckBag?)
          )
        else . end
  # 每日导读
  - response_jq:
      match: '^https://magev6\.if\.qidian\.com/argus/api/v2/dailyrecommend/getdailyrecommend\?'
      filter: >-
        if ((.Data? | type) == "object") and (.Data | has("Items"))
        then .Data.Items = [] else . end
  # 我的页面：删福利按钮推广
  - response_jq:
      match: '^https://magev6\.if\.qidian\.com/argus/api/v3/user/getaccountpage\?'
      filter: >-
        del(.Data?.BenefitButtonList?)

mitm:
  hostnames:
    - magev6.if.qidian.com
    - ywab.reader.qq.com
