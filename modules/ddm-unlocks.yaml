name: 叮当猫解锁
description: chxm1023/Rewrite 全量脚本的声明式移植，订阅与会员解锁、界面净化，需清缓存或重装生效。
author: chxm1023
homepage: https://github.com/chxm1023/Rewrite
icon: https://raw.githubusercontent.com/luestr/IconResource/main/Other_icon/120px/AppStore.png
# 来源: https://github.com/chxm1023/Rewrite —— 226 个脚本逐个读源码后手写转换，
#   每条规则上方注明解锁了什么、原脚本地址、要拦截的域名。
# 本模块零 scriptings、零 response_regex、零 walk 查表，全部声明式：
#   response_jq      313 条  固定 JSON 改写（jq 二进制跑过负载验证）
#   map_locals       57 条  固定回执与固定响应体
#   url_rewrites     13 条  reject / 302 跳转
# 原文用 body.replace(/.../g, ...) 做全文正则手术的 44 个脚本整脚本出局：
#   那种写法塞不进 jq（类型边界、转义、同键多值都对不上），硬译只是把
#   JS 正则的语义搬进另一套引擎再赌它等价 —— 不是声明式规则，本模块不收，
#   连这些脚本名下的固定响应与 reject 一起走。
#   40sishi, FT, SmartGym, aituiwen, alidrive, artgo, artify, ccjt
#   duitang, fanshuxiaoshuo, flowkey, hujuvod, hunliji, jiakaobaodian
#   lepai, ltsst, luqijianggushi, meirikaisang, mingxiangxingqiu
#   mtywj, ningmengqds, rljq, rq, scjy, shuashuati, uua, wywnds
#   xcx_donghuatai, xcx_xiaodaka, xiangyubizhi, xiaokaobao
#   xiaomaizaixian, xinzang, xxbzdq, yeguoyuedu, yffxzs, yifeijizhang
#   yiqilianqin, yiyan, yjb, yueqi, yunting, zhfqjt, zhhst
# 排除（按你的要求）:
#   · iTunes 回执引擎与 buy.itunes.apple.com 全部条目
#   · RevenueCat 全链路（不是只 api.revenuecat.com）：凡是回执/订阅走 RevenueCat 的
#     match 与 X-RevenueCat-ETag 头操作一律清掉 —— zhinengzhushou.js、Context.js、
#     LinearityCurve.js 三个脚本整脚本出局，rc-backup、visionarytech、linearity 的宿主同去
#   · JavDB.js（含 api.hechuangxinxi.xyz 三端点）
#   · bdcloud.js（百度网盘）
#   · 彩云天气系列（caiyun.js / caiyun_svip.js / caiyuntianqi.js）——
#     cyapi.cn、caiyunapp.com 全部端点连请求头注入一起去掉
#   · boom.js（apimboom2.globaldelight.net/itunesreceipt_v2.php，match 带 itunes）
#   · 这些脚本整脚本出局，一条规则都不留（连原本能硬译的 reject/302 也一并去掉）：
#     adapty / qonversion / fileball / VideoShow / kwyy / bending / Dualsub / zyyad ×2 / splice
# mitm.hostnames 逐字照抄原脚本 `[mitm] hostname =` 的声明，一个域名都不推导、不补。
# 两个脚本的 match 里带了自家 mitm 没声明的分支（Craft 的 docs.craft.do、
# 13geapp 的 standard.linhongshi.com），那两个分支在原作者脚本里本来就不会命中，
# 所以把 match 收窄到声明范围，而不是往 mitm 里塞域名把它们救活。

url_rewrites:
# === liangjihui.js — 靓机汇 首页滚屏广告位（原脚本第二条规则 reject）
# 解锁: 去广告 — 小程序 home/getHomeList 直接拒绝
# 原脚本: https://raw.githubusercontent.com/chxm1023/Rewrite/main/liangjihui.js
# mitm: ljh.dianxiaoman.com
  - match: '^https://ljh\.dianxiaoman\.com/ljh/api/home/getHomeList'
    location: http://reject/

  - match: '^https?://ftmailbox\.cn/ad_impression/.+'
    location: http://reject-200/

# 原脚本第二条规则: ^https?://pay\.kuso\.xyz/pay/pay-check url reject-200（拦掉支付校验）
  - match: '^https?://pay\.kuso\.xyz/pay/pay-check'
    location: http://reject-200/

# 开屏/信息流广告拦截（原脚本 reject / reject-200）
  - match: '^https?://.*\.pangolin-sdk-toutiao.*\.com'
    location: http://reject/

  - match: '^https?://mhjk\.1391\.com'
    location: http://reject-200/

  - match: '^https?://opencloud\.wostore\.cn'
    location: http://reject-200/

  - match: '^https?://open\.e\.kuaishou\.com'
    location: http://reject-200/

  - match: '^https?://mi\.gdt\.qq\.com'
    location: http://reject-200/

  - match: '^https?://mobads\.baidu\.com'
    location: http://reject-200/

  - match: '^https?://ios\.bugly\.qq\.com'
    location: http://reject-200/

  - match: '^https?://sdk\.e\.qq\.com'
    location: http://reject-200/

  - match: '^https?://analytics\.oceanengine\.com'
    location: http://reject-200/

  - match: '^https:\/\/tk\.lanjiyin\.com\.cn\/img'
    location: http://reject/

body_rewrites:
