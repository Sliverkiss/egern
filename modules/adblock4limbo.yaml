name: 毒奶去网页广告
description: 去网页广告：搜索引擎、视频、漫画、小说站点的弹窗与广告移除（毒奶 Adblock4limbo 移植）。
author: limbopro, Sliverkiss
homepage: https://github.com/limbopro/Adblock4limbo
icon: https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Adguard/Adblock4limbo.png
#
# merged from: limbopro/Adblock4limbo@2026-11-14（Adblock4limbo.module Loon 版为基准，
#   .conf / .sgmodule 交叉核对——三者内容一致，.module 的 [URL Rewrite] 与 .conf 等价）
# absorption:
#   [URL Rewrite] 51 条 → 原生 url_rewrites（reject → http://reject/，307 跳转保留状态码）
#   [Script] 65 条 → 原生 scriptings，脚本逻辑零改动
#     script_url 采用原作仓库 GitHub raw 地址（.conf 官方同款）：
#     https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Adguard/Adblock4limbo.js
#     .module 里原配的 limbopro.com/Adguard/ 路径当前 404，GitHub raw 实测 200，
#     两处内容经 diff 验证一致，且 raw 随官方 main 分支提交自动更新
#   [Header Rewrite] xvideos CSP 清除 1 条 → header_rewrites delete
#   [MITM] 461 个 hostname 去重；colamanga.com 为原作显式排除（- 前缀），保留排除
# conflicts resolved:
#   无冲突——单一权威源（官方仓库），三格式互为镜像

url_rewrites:
