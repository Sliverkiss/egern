header_rewrites:
  # xvideos 放宽 CSP 以允许去广告脚本注入（原 [Header Rewrite] header-replace）
  - delete:
      match: '^https?:\/\/(www\.xvideos)(\.)(\w{0,3})(?!(.*(api|cdn-cgi|verify|auth|captch|\.))).*'
      name: Content-Security-Policy
      type: response

scriptings:
