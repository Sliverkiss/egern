      name: 知道搜索广告(zhidao.baidu.com)
      match: '^https?:\/\/(zhidao)\.baidu\.com\/(question|index|\?fr|\?word)'
      script_url: https://raw.githubusercontent.com/limbopro/Adblock4limbo/main/Adguard/Adblock4limbo.js
      max_size: 1048576
      timeout: 10
      body_required: true
  - http_response:
      name: 搜索首页广告(www.baidu.com)
      match: 'https?:\/\/(www|m)\.baidu\.com(/$|\/\?ref.*)'
